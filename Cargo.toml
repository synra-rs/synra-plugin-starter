[package]
name = "synra-plugin-starter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = [ "imba97 <mail@imba97.cn>" ]
repository = "https://github.com/synra-rs/synra-plugin-starter"
description = "Reference plugin for Synra host capabilities"
publish = false

[package.metadata.synra.ui]
source = "ui/dist"
command = [
  "pnpm",
  "--filter",
  "@synra-plugin/starter-ui",
  "build"
]

[lib]
crate-type = [
  "cdylib",
  "rlib"
]

[dependencies]
synra-plugin-sdk = { git = "https://github.com/synra-rs/synra-core.git", rev = "e0c5481494b409af6fdbbdec9f78786ae4ee0612" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
